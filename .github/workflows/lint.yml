name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  discover:
    name: Discover Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v6
      - id: set-modules
        run: |
          # Find modules excluding adk-go and redisconn
          MODULES=$(find . -name go.mod -not -path '*/.*' -not -path './adk-go/*' -exec dirname {} \; | sort | jq -R . | jq -s -c .)
          echo "modules=$MODULES" >> $GITHUB_OUTPUT

  lint:
    name: Lint (${{ matrix.module }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sqlc
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      # TODO: remove this after dealing with test fixes
      - name: Create dummy secrets for CI
        run: |
          mkdir -p internal/adapters/ory
          touch internal/adapters/ory/ory.secret
          mkdir -p internal/adapters/gemini
          touch internal/adapters/gemini/.gemini.secret
      - name: Generate
        run: go generate ./...
        working-directory: ${{ matrix.module }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yaml --timeout 10m
